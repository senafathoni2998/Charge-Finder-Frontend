name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      # NOTE: `npm run typecheck` and `npm run lint` are intentionally NOT gated yet —
      # the codebase has ~15 pre-existing type errors and ~160 lint errors (react-leaflet
      # types, MUI Button generics, react-hooks rules). Enable these gates as part of the
      # refactor plan (RF1/RF4) once those are cleaned up.
