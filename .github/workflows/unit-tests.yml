name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      # NOTE: `npm run lint` is not gated yet — the codebase still has ~160 pre-existing
      # eslint errors (react-hooks rules, unused vars). Enable that gate after a lint pass.
