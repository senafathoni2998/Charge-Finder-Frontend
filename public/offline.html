<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <title>Charge Finder — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/app-logo.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f6f7fb;
        color: rgba(10, 10, 16, 0.92);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid rgba(10, 10, 16, 0.08);
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 12px 30px rgba(10, 10, 16, 0.1);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(124, 92, 255, 0.95), rgba(0, 229, 255, 0.85));
      }
      .badge img { width: 34px; height: 34px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: rgba(10, 10, 16, 0.68); line-height: 1.5; margin: 0 0 20px; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #1976d2;
        border-radius: 12px;
        padding: 12px 22px;
      }
      button:hover { background: #1565c0; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><img src="/app-logo.svg" alt="Charge Finder" /></div>
      <h1>You're offline</h1>
      <p>
        Charge Finder can't reach the network right now. Reconnect to load fresh
        stations — the last stations you loaded are still available in the app.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
